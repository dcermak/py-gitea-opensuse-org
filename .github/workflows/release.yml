---
name: release to PyPI

on:
  push:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6
        if: github.event_name != 'workflow_call'

      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_call'
        with:
          ref: refs/tags/${{ inputs.release_version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Check the wheel
        run: |
          pip install twine
          twine check dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_call' && inputs.release_version != '')
